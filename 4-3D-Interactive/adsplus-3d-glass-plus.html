header img{height:24px;display:block}
.bar{position:fixed;left:clamp(20px,4vw,56px);right:clamp(20px,4vw,56px);bottom:calc(22px + env(safe-area-inset-bottom,0px));
  z-index:2;display:flex;gap:22px;flex-wrap:wrap;align-items:center;font-size:13px}
.bar span{color:var(--muted);margin-right:auto}
button{font:inherit;color:#fff;background:none;border:0;border-bottom:1px solid var(--muted);padding:4px 0;cursor:pointer}
button:hover{border-color:var(--red)}
button:focus-visible{outline:2px solid var(--red);outline-offset:3px}
button[disabled]{color:var(--muted);cursor:wait}
button[aria-pressed="true"]{border-color:var(--red)}
.err{position:fixed;inset:0;display:grid;place-items:center;color:var(--muted)}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
if(!window.THREE){document.body.insertAdjacentHTML('beforeend','<p class="err">three.js could not load. Check the internet connection and reload.</p>');return;}
const LOOP=8, TAU=Math.PI*2;
const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const el=document.getElementById('stage');

const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true,preserveDrawingBuffer:true});
renderer.setPixelRatio(Math.min(devicePixelRatio||1,2));
renderer.outputEncoding=THREE.sRGBEncoding;
renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;
renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
el.appendChild(renderer.domElement);

const scene=new THREE.Scene();
scene.background=new THREE.Color(0x000000);
scene.fog=new THREE.Fog(0x000000,9,20);

// Environment for glossy reflections: a soft box top-left, like the photo
(function(){
  const env=new THREE.Scene();env.background=new THREE.Color(0x020202);
  const add=(w,h,c,p)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:c,side:THREE.DoubleSide}));m.position.set(...p);m.lookAt(0,0,0);env.add(m);};
  add(6,4,new THREE.Color(6,6,6),[-5,7,4]);
  add(2,5,new THREE.Color(1.6,0.2,0.2),[6,1,-3]);
  add(3,1,new THREE.Color(0.8,0.8,0.8),[2,-3,5]);
  const pm=new THREE.PMREMGenerator(renderer);scene.environment=pm.fromScene(env,0.02).texture;pm.dispose();
})();

const camera=new THREE.PerspectiveCamera(30,1,0.1,60);
camera.position.set(1.6,1.0,10.5);camera.lookAt(0,1.55,0);

// Lights
const key=new THREE.SpotLight(0xffffff,3.2,40,0.42,0.55,1.2);
key.position.set(-6,10,5);key.target.position.set(0,1,0);
key.castShadow=true;key.shadow.mapSize.set(2048,2048);key.shadow.bias=-0.0004;key.shadow.radius=6;
scene.add(key,key.target);
const backRed=new THREE.PointLight(0xff1a1a,2.4,9,2);backRed.position.set(2.2,0.6,-2.2);scene.add(backRed);
const inner=new THREE.PointLight(0xff3030,1.4,4,2);inner.position.set(0,1.6,0);scene.add(inner);
scene.add(new THREE.HemisphereLight(0x404040,0x000000,0.35));

// Floor with a pool of light
const floorMat=new THREE.MeshStandardMaterial({color:0x2a2828,roughness:0.85,metalness:0});
const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),floorMat);
floor.rotation.x=-Math.PI/2;floor.receiveShadow=true;scene.add(floor);
const spill=new THREE.Mesh(new THREE.CircleGeometry(1.9,64),new THREE.MeshBasicMaterial({color:0xff1010,transparent:true,opacity:0.12,depthWrite:false,blending:THREE.AdditiveBlending}));
spill.rotation.x=-Math.PI/2;spill.position.y=0.005;scene.add(spill);

// The plus: proportions taken from the photo (bar ≈ 1/3 of the width, deep body)
function plusShape(size,bar){const a=size/2,b=bar/2,s=new THREE.Shape();
  [[-b,a],[b,a],[b,b],[a,b],[a,-b],[b,-b],[b,-a],[-b,-a],[-b,-b],[-a,-b],[-a,b],[-b,b]].forEach((p,i)=>i?s.lineTo(p[0],p[1]):s.moveTo(p[0],p[1]));
  s.closePath();return s;}
const SIZE=3,BAR=1.05,DEPTH=0.95,BEV=0.035;
const geo=new THREE.ExtrudeGeometry(plusShape(SIZE,BAR),{depth:DEPTH,bevelEnabled:true,bevelThickness:BEV,bevelSize:BEV,bevelSegments:2});
geo.center();

const plus=new THREE.Group();
// inner volume: back faces, gives the glass its depth and darker core
const volume=new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({color:0x7a0408,emissive:0x2a0000,roughness:0.25,
  side:THREE.BackSide,transparent:true,opacity:0.85,envMapIntensity:0.6}));
volume.renderOrder=1;
// a softer glowing core, like light trapped inside the block
const core=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({color:0xb0101a,transparent:true,opacity:0.18,depthWrite:false,blending:THREE.AdditiveBlending}));
core.scale.set(0.9,0.9,0.75);core.renderOrder=2;
// outer skin: glossy red glass
const skin=new THREE.Mesh(geo,new THREE.MeshPhysicalMaterial({color:0xd0141c,emissive:0x1a0002,roughness:0.06,metalness:0,
  clearcoat:1,clearcoatRoughness:0.03,transmission:0.3,transparent:true,opacity:0.62,envMapIntensity:2.2,depthWrite:false}));
skin.renderOrder=3;skin.castShadow=true;
// bright glass edges
const edges=new THREE.LineSegments(new THREE.EdgesGeometry(geo,25),new THREE.LineBasicMaterial({color:0xff8a8a,transparent:true,opacity:0.32,blending:THREE.AdditiveBlending,depthWrite:false}));
edges.renderOrder=4;
// shadow caster (invisible solid) so the plus throws a red-dark shadow
const caster=new THREE.Mesh(geo,new THREE.MeshBasicMaterial({colorWrite:false,depthWrite:false}));caster.castShadow=true;
plus.add(volume,core,skin,edges,caster);
plus.position.y=SIZE/2+BEV;
scene.add(plus);

// Interaction
let spin=0,vel=0,drag=null,recording=false,t0=performance.now();
const c=renderer.domElement;
c.addEventListener('pointerdown',e=>{drag=e.clientX;c.setPointerCapture(e.pointerId);c.style.cursor='grabbing';});
c.addEventListener('pointermove',e=>{if(drag===null)return;const d=(e.clientX-drag)*0.008;spin+=d;vel=d;drag=e.clientX;if(reduce)draw(performance.now());});
c.addEventListener('pointerup',()=>{drag=null;c.style.cursor='grab';});

function resize(){const w=el.clientWidth,h=el.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;
  camera.fov=w/h<0.8?44:30;camera.updateProjectionMatrix();if(reduce)draw(performance.now());}
addEventListener('resize',resize);resize();

function draw(now){
  const t=(reduce&&!recording)?0:(now-t0)/1000,p=(t%LOOP)/LOOP;
  if(!recording&&drag===null){vel*=0.94;spin+=vel;}
  plus.rotation.y=-0.45+0.5*Math.sin(p*TAU)+(recording?0:spin);
  inner.intensity=1.2+0.3*Math.sin(p*TAU*2);
  renderer.render(scene,camera);
}
(function loop(now){if(!reduce||recording)draw(now);requestAnimationFrame(loop);})(performance.now());
draw(performance.now());

// Transparent background toggle (for placing the plus on any page color)
const bgBtn=document.getElementById('bg');
bgBtn.addEventListener('click',()=>{const on=bgBtn.getAttribute('aria-pressed')!=='true';bgBtn.setAttribute('aria-pressed',on);
  scene.background=on?null:new THREE.Color(0);floor.visible=spill.visible=!on;scene.fog=on?null:new THREE.Fog(0,9,20);
  document.body.style.background=on?'repeating-conic-gradient(#222 0 25%,#2c2c2c 0 50%) 0 0/24px 24px':'#000';draw(performance.now());});

function download(href,name){const a=document.createElement('a');a.href=href;a.download=name;document.body.appendChild(a);a.click();a.remove();}
document.getElementById('png').addEventListener('click',()=>{draw(performance.now());download(c.toDataURL('image/png'),'adsplus-glass-plus.png');});

const vb=document.getElementById('vid');
vb.addEventListener('click',()=>{
  const types=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm','video/mp4'];
  const type=window.MediaRecorder&&c.captureStream?types.find(x=>MediaRecorder.isTypeSupported(x)):null;
  if(!type){vb.textContent='Video not supported in this browser';return;}
  const rec=new MediaRecorder(c.captureStream(60),{mimeType:type,videoBitsPerSecond:12e6}),chunks=[];
  rec.ondataavailable=e=>e.data.size&&chunks.push(e.data);
  rec.onstop=()=>{recording=false;vb.disabled=false;vb.textContent='Save video';
    download(URL.createObjectURL(new Blob(chunks,{type})),'adsplus-glass-plus.'+(type.includes('mp4')?'mp4':'webm'));};
  recording=true;t0=performance.now();vb.disabled=true;vb.textContent='Recording 8s…';rec.start();
  setTimeout(()=>rec.stop(),LOOP*1000+80);
});
})();
</script>
</body>
</html>
